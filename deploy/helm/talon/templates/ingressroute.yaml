{{- /* Auth host — Talon's own UI (auth/start, auth/callback, auth/logout). */}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "talon.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.ingressClassName | quote }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.authHost }}`)
      kind: Rule
      services:
        - name: {{ include "talon.fullname" . }}
          port: {{ .Values.service.ports.https }}
          scheme: https
          serversTransport: {{ include "talon.fullname" . }}-https
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- /* Per-host protected admin routes. Phase 1 lands prometheus.ops first. */}}
{{- range .Values.ingress.protectedHosts }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "talon.fullname" $ }}-host-{{ .host | replace "." "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "talon.labels" $ | nindent 4 }}
    talon.hexxlock.com/protected-host: {{ .host | quote }}
  annotations:
    kubernetes.io/ingress.class: {{ $.Values.ingress.ingressClassName | quote }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .host }}`)
      kind: Rule
      services:
        - name: {{ include "talon.fullname" $ }}
          port: {{ $.Values.service.ports.https }}
          scheme: https
          serversTransport: {{ include "talon.fullname" $ }}-https
  tls:
    secretName: {{ $.Values.ingress.tlsSecretName }}
{{- end }}
---
{{- /* serversTransport tells Traefik to skip TLS verify for the in-cluster
       hop to Talon's :8443 (Talon's cert is signed by example-tenant-ca,
       Linkerd handles mTLS at the transport layer regardless). */}}
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ include "talon.fullname" . }}-https
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
spec:
  insecureSkipVerify: true
