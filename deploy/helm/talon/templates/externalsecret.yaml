{{- if .Values.externalSecrets.cookieEncryptKey.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: talon-cookie-encrypt-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.cookieEncryptKey.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: talon-cookie-encrypt-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecrets.cookieEncryptKey.fields }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecrets.cookieEncryptKey.vaultKey }}
        property: {{ .vaultProperty }}
    {{- end }}
{{- end }}
