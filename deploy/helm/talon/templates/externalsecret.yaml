---
{{- /* spicedb-psk: ESO reads the same Vault path the spicedb chart's own
       ExternalSecret uses (platform/spicedb/psk) — Vault is the single
       source of truth; two ESO consumers materialising into different
       namespaces is the canonical pattern for cross-ns secret access
       when Vault is upstream. (We initially planned Reflector mirror
       but it isn't deployed in this cluster.) */}}
{{- if .Values.spicedb.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.spicedb.pskSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
  annotations:
    example.com/source: vault://example/platform/spicedb/psk
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.spicedb.pskSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: presharedkey
      remoteRef:
        key: platform/spicedb/psk
        property: presharedkey
{{- end }}
---
{{- if and .Values.iapIdentityToken.enabled .Values.externalSecrets.iapIdentityKey.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: talon-iap-identity-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
  annotations:
    example.com/source: vault://example/{{ .Values.externalSecrets.iapIdentityKey.vaultKey }}
    example.com/purpose: |
      RS256 private key for the IAP identity-token JWT
      (X-Talon-Identity-Token). Verifiers fetch the matching public key
      from https://auth.internal.example.com/.well-known/jwks.json. Dedicated
      key per NIST SP 800-57 §5.2 — never reused for any other purpose.
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.iapIdentityKey.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: talon-iap-identity-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecrets.iapIdentityKey.fields }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecrets.iapIdentityKey.vaultKey }}
        property: {{ .vaultProperty }}
    {{- end }}
{{- end }}
---
{{- if .Values.externalSecrets.harborPull.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talon.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.harborPull.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: harbor-registry-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # Build the dockerconfigjson with auth = b64(user:pass).
        # `printf` is the standard ESO templating helper for username:password concat.
        #
        # Multi-registry support (Path B Phase H-5f, 2026-06-09): the chart now
        # accepts EITHER `registry` (legacy, single-host string) OR `registries`
        # (list of hosts — preferred for the *.example.com → *.internal.example.com
        # transition where the same Vault credential serves both auth keys so
        # kubelet's per-host lookup works regardless of which URL kubelet sees
        # in the Pod's image ref). When BOTH are set, `registries` wins.
        {{- $registries := .Values.externalSecrets.harborPull.registries | default (list .Values.externalSecrets.harborPull.registry) }}
        .dockerconfigjson: |
          {"auths":{ {{- range $i, $reg := $registries -}}
          {{- if gt $i 0 }},{{ end -}}
          "{{ $reg }}":{"auth":"{{ `{{ printf "%s:%s" .robot_username .robot_password | b64enc }}` }}"}
          {{- end }} }}
  data:
    - secretKey: robot_username
      remoteRef:
        key: {{ .Values.externalSecrets.harborPull.vaultKey }}
        property: robot_username
    - secretKey: robot_password
      remoteRef:
        key: {{ .Values.externalSecrets.harborPull.vaultKey }}
        property: robot_password
{{- end }}
