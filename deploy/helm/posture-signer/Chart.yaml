apiVersion: v2
name: posture-signer
description: >-
  ZTNA Phase 4 posture-signer — RS256 JWS issuer for Access Agent device-posture
  heartbeats. Backed by Vault Transit (key never on disk). Two replicas for HA.
  Inbound auth: Linkerd mTLS (pod identity) + jess-device-ca client cert (device identity).
  Metrics on :9090/metrics. JWKS at /.well-known/jwks.json consumed by Talon verifier.
type: application
version: 0.1.0
appVersion: "0.0.0"
maintainers:
  - name: HexxLock Platform Team
    email: dogukanturhal@hexxlock.com
keywords:
  - ztna
  - posture
  - jws
  - vault-transit
  - zero-trust
sources:
  - https://github.com/dogukanturhal/talon
