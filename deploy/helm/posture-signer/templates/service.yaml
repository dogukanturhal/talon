apiVersion: v1
kind: Service
metadata:
  name: {{ include "posture-signer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posture-signer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "posture-signer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
