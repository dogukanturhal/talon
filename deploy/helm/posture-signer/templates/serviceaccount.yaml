apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posture-signer.labels" . | nindent 4 }}
  annotations:
    # This SA is bound to the Vault Kubernetes auth role `posture-signer`
    # (datacenters/eu-west-1/vault/posture-signer-key.tf). Changing the SA
    # name requires a coordinated Atlantis MR to update the TF resource.
    example.com/vault-role: "posture-signer"
