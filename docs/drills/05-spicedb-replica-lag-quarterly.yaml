# Drill 05 — SpiceDB read-replica lag (quarterly)
#
# Per ADR 0042 §9.c. Exercises Talon's ReBAC stale-read tolerance.
#
# Talon's ReBAC layer (per ADR 0009 §3 + ADR 0040 §Phase 5) queries
# SpiceDB for permission checks at request-time. SpiceDB exposes a
# "consistency" parameter that lets callers trade freshness for
# latency:
#   - full-consistency  → reads guaranteed latest, ~50ms p99
#   - minimize-latency  → may read up to ZedTokenLag stale, ~5ms p99
#   - at-exact-snapshot → reads from a named ZedToken, ~5ms p99
#
# Talon defaults to minimize-latency for non-critical-sensitivity
# routes + at-exact-snapshot for critical-sensitivity routes. This
# drill artificially delays SpiceDB read-replica responses by 500ms
# to confirm:
#   (a) Talon p99 doesn't cascade above 1s (Phase 5 latency budget),
#   (b) routes that pinned at-exact-snapshot don't experience extra
#       latency (they use the snapshot, not the slow replica),
#   (c) at-exact-snapshot caching IS in fact happening (would
#       manifest as the route's permission-check latency rising
#       LINEARLY with replica lag if caching is broken).
#
# Failure modes this drill catches:
#   - If Talon's consistency-level routing is broken (every check
#     hits the slow replica)
#   - If the SpiceDB client is doing per-request connection setup
#     (would amplify replica lag into TCP handshake cost)
#   - If a 500ms lag causes Talon to time out and 5xx instead of
#     degrading gracefully (would indicate the timeout budget is
#     too tight)
#
# Schedule: quarterly Tuesday 04:00 UTC. Quarterly cadence is
# sufficient because SpiceDB's read-replica architecture rarely
# changes; the drill is here to catch UPSTREAM regressions in the
# Talon-side query path.
#
# REF: chaos-mesh.org/docs/simulate-network-chaos-on-kubernetes/#network-delay
# REF: authzed.com/docs/spicedb/concepts/consistency
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: spicedb-replica-lag-quarterly
  namespace: chaos-mesh
  labels:
    drill.hexxlock.com/family: ztna-phase9
    drill.hexxlock.com/severity: medium
    drill.hexxlock.com/adr: "0042"
spec:
  # Quarterly Tuesday 04:00 UTC — first Tuesday of Jan/Apr/Jul/Oct
  schedule: "0 4 1-7 1,4,7,10 2"
  historyLimit: 8
  concurrencyPolicy: Forbid
  type: NetworkChaos
  networkChaos:
    action: delay
    duration: "10m"
    mode: all
    selector:
      namespaces:
        - spicedb
      labelSelectors:
        app.kubernetes.io/name: spicedb
        # Read replicas only — the writer replica must stay fast
        # so Talon's at-exact-snapshot calls can pin to a fresh
        # ZedToken.
        spicedb.authzed.com/role: replica
    delay:
      # 500ms ± 50ms jitter — adversarial-but-realistic representation
      # of a poorly-behaved read replica under unusual load.
      latency: "500ms"
      jitter: "50ms"
      correlation: "25"
