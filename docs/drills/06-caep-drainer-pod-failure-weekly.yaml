# Drill 06 — CAEP outbox drainer pod-failure (weekly)
#
# Per ADR 0042 §9.c. Exercises the CAEP transactional-outbox
# at-least-once delivery guarantee.
#
# The CAEP outbox drainer (falcon-id `internal/services/caep_outbox_drainer.go`,
# 968 LOC) runs as a goroutine inside the falcon-id Deployment. It
# claims pending rows from iam_caep_event_outbox via SKIP LOCKED +
# cross-replica advisory lock, delivers each via HTTP POST, then
# updates status to sent/retry/dead in the same DB transaction.
#
# Killing the drainer pod mid-flight MUST NOT lose any outbox row:
#   (a) the in-progress transaction rolls back (committed=false defer
#       in drainOnce ensures this — falcon-id `caep_outbox_drainer.go:204-209`),
#   (b) the next drainer pod (or next tick of the surviving pod)
#       reclaims the rows that were in flight via SKIP LOCKED,
#   (c) sent rows stay sent (HTTP-already-delivered + row-marked-sent
#       are in the same transaction — partial state is impossible).
#
# Failure modes this drill catches:
#   - If a row gets stuck in status='pending' with attempt_count
#     incrementing past 5 without a sent (would indicate the killed
#     pod's transaction silently committed updates to status without
#     actually delivering HTTP)
#   - If duplicate delivery rate exceeds the receiver dedup budget
#     (RFC 8417 SET 'jti' is the dedup key; receivers MUST track
#     recently-seen jtis per RFC 8935 §3 — drill confirms duplicates
#     are bounded per Phase 6 delivery contract)
#   - If the post-kill catch-up wave saturates downstream receivers
#     (would manifest as a spike in `iam_caep_outbox_delivery_outcomes_total`
#     {outcome="retry"} immediately after pod-restart)
#
# Schedule: weekly Wednesday 02:00 UTC. Weekly drum-beat keeps the
# drainer's failure mode fresh in the on-call playbook. Wednesday
# avoids overlap with drills 01/02 (Sunday + 1st-of-month).
#
# This drill is gated by CAEP_OUTBOX_ENABLED — see the Pre-flight
# checks section in the ADR 0042 runbook. Until the flag is true in
# the targeted environment, this Schedule's PodChaos fires harmlessly
# (the drainer goroutine isn't spawned) but emits a Warn log so the
# operator knows the drill isn't actually exercising the path.
#
# REF: chaos-mesh.org/docs/define-chaos-experiment-scope/
# REF: ADR 0040 Phase 6 §Operational expectations
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: caep-drainer-pod-failure-weekly
  namespace: chaos-mesh
  labels:
    drill.hexxlock.com/family: ztna-phase9
    drill.hexxlock.com/severity: low
    drill.hexxlock.com/adr: "0042"
spec:
  # Wednesdays at 02:00 UTC
  schedule: "0 2 * * 3"
  historyLimit: 5
  concurrencyPolicy: Forbid
  type: PodChaos
  podChaos:
    action: pod-failure
    # The chaos lasts 120s — long enough that the killed pod's
    # in-flight HTTP POSTs hit their 5s drainer-config timeout
    # AND the surviving pod's next tick claims the abandoned rows
    # via SKIP LOCKED (drainer TickInterval default 5s, so within
    # 10s of pod-kill the surviving pod is processing the orphans).
    duration: "120s"
    mode: one  # ONE pod, not all-of-N
    selector:
      namespaces:
        - falcon-id
      labelSelectors:
        app.kubernetes.io/name: falcon-id
        # Only target pods that ARE running the drainer; the
        # CAEP_OUTBOX_ENABLED env-var flips this on at the
        # binary level. The label is set on the Pod's
        # metadata.labels by the chart when the flag is true,
        # so this selector ensures we don't waste a drill firing
        # on a pre-rollout deployment.
        falcon-id.hexxlock.com/caep-drainer: enabled
