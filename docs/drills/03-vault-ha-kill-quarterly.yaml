# Drill 03 — Vault HA voter kill (quarterly)
#
# Per ADR 0042 §9.c. Exercises the Vault Raft re-election path.
#
# Vault HA runs as a 3-replica StatefulSet with Raft consensus. Killing
# the active leader (or any voter) forces Raft to:
#   (a) detect the missing heartbeat (default election timeout 1s),
#   (b) hold an election among the remaining 2 voters,
#   (c) elect a new leader within ~5-10s,
#   (d) resume PKI sign + KV reads + Transit signs from the new
#       leader without dropping any in-flight requests.
#
# Failure modes this drill catches:
#   - If the election timeout is misconfigured and elections drag past 30s
#     (would cascade into PKI-sign 5xx on jess-ca, jess-device-ca, etc.)
#   - If the new leader hasn't been validated with Transit/seal-wrap
#     keys (Vault would refuse the leadership)
#   - If a single voter loss breaks quorum (would indicate Vault HA is
#     mis-deployed as 2 voters not 3)
#   - If the standbys haven't been keeping the in-memory cache warm
#     and the first post-failover request hits cold storage
#     (would manifest as p99 latency spike on PKI sign after election)
#
# Schedule: quarterly Monday 04:00 UTC. The full election + reseal
# cycle has the largest blast radius among the chaos drills — every
# component that depends on Vault PKI / KV / Transit briefly
# experiences elevated latency. Quarterly cadence is conservative;
# bump to monthly once the drill has run cleanly for 4 consecutive
# quarters.
#
# SEVERITY HIGH: pre-drill check confirms remaining voters are
# healthy + Vault has accepted recent writes. If either is false,
# the drill is rescheduled. This is the only manifest in this
# directory where the on-call MUST be alerted at chaos-start
# (configured via the chaos-mesh Status webhook to AlertManager).
#
# REF: chaos-mesh.org/docs/define-chaos-experiment-scope/
# REF: vaultproject.io/docs/concepts/ha (Raft details)
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: vault-ha-voter-kill-quarterly
  namespace: chaos-mesh
  labels:
    drill.hexxlock.com/family: ztna-phase9
    drill.hexxlock.com/severity: high
    drill.hexxlock.com/adr: "0042"
  annotations:
    # AlertManager webhook annotation — the chaos-mesh status-monitor
    # picks this up at experiment-start and routes to on-call.
    drill.hexxlock.com/notify-on-start: "true"
spec:
  # Quarterly Monday 04:00 UTC — first Monday of Jan/Apr/Jul/Oct
  schedule: "0 4 1-7 1,4,7,10 1"
  historyLimit: 8  # 2 years of quarterly runs visible
  concurrencyPolicy: Forbid
  type: StressChaos
  stressChaos:
    # CPU stress that pushes the targeted pod into OOM territory —
    # cleaner than pod-failure-only because it exercises the
    # graceful-shutdown path on the way out (Raft pre-vote step-down
    # signals propagate before kill).
    duration: "90s"
    mode: one  # ONE voter, not all-of-3
    selector:
      namespaces:
        - vault
      labelSelectors:
        app.kubernetes.io/name: vault
        # Pick from the StatefulSet pods (vault-ha-0/1/2). Chaos
        # Mesh randomly selects one when mode=one.
        component: server
    stressors:
      cpu:
        workers: 8
        load: 100
      memory:
        workers: 4
        # ~80% of the pod's memory limit — pushes the OOM killer
        # below the leader's working-set so eviction is decisive.
        size: "3GB"
