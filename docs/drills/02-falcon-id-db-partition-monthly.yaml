# Drill 02 — Falcon-ID ↔ falcon-id-pg network partition (monthly)
#
# Per ADR 0042 §9.c. Exercises the OIDC introspect cache-failover path.
#
# When Falcon-ID can't reach its PG (falcon-id-pg-rw service), it MUST:
#   (a) keep serving introspect for ALREADY-issued tokens from the
#       in-memory introspect cache (5-min TTL per Phase 6 §6.3 wire),
#   (b) reject NEW token issuance (POST /oauth/token) with 503 —
#       this is the right failure mode because issuing without a
#       healthy DB write path would lose audit/session-state,
#   (c) recover automatically when the partition heals.
#
# Failure modes this drill catches:
#   - If the introspect cache is too short (auth fails for existing
#     sessions during the partition)
#   - If the cache is too long (revocation events lag past the
#     partition window's tolerance)
#   - If the pgxpool doesn't reconnect cleanly post-partition
#     (would manifest as sustained 500s after the partition heals)
#   - If a partition triggers OIDC clients into a re-auth cascade
#     (would manifest as a spike in /oauth/authorize traffic at
#     partition-end)
#
# Schedule: 1st of month, 03:00 UTC. Monthly cadence balances the
# operational cost (5-min DB outage simulated, even on non-prod
# tenant, generates real telemetry alerts) against the value of
# catching regressions before they hit a real partition.
#
# REF: chaos-mesh.org/docs/simulate-network-chaos-on-kubernetes/
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: falcon-id-db-partition-monthly
  namespace: chaos-mesh
  labels:
    drill.hexxlock.com/family: ztna-phase9
    drill.hexxlock.com/severity: medium
    drill.hexxlock.com/adr: "0042"
spec:
  # 1st of each month at 03:00 UTC
  schedule: "0 3 1 * *"
  historyLimit: 5
  concurrencyPolicy: Forbid
  type: NetworkChaos
  networkChaos:
    action: partition
    # 5-minute outage — long enough to validate the introspect
    # cache covers existing sessions through the gap; short enough
    # that a real client retry budget can ride it out without
    # cascade failures.
    duration: "5m"
    mode: all  # ALL falcon-id pods see the partition (the network-
               # layer partition is between falcon-id and falcon-id-pg
               # — not between two falcon-id pods)
    selector:
      namespaces:
        - falcon-id
      labelSelectors:
        app.kubernetes.io/name: falcon-id
    # Partition target: traffic to falcon-id-pg-rw (the read-write
    # PG service for primary CNPG instance). The drill cleanly
    # isolates the "DB is unreachable" case without touching SpiceDB,
    # Vault, or Redis (which have separate drills).
    direction: to
    target:
      mode: all
      selector:
        namespaces:
          - cnpg-clusters
        labelSelectors:
          cnpg.io/cluster: falcon-id-pg
          cnpg.io/instanceRole: primary
